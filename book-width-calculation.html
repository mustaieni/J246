<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<title>1600×1200 螢幕：上下並列兩張 Sheet</title>
<style>
  body{font-family:sans-serif;text-align:center;padding:80px}
</style>
<script>
/* ① ② ↙︎ 改成自己的試算表網址 */
const topURL = 'https://docs.google.com/spreadsheets/d/1WjHCuetUUu86FsixgWjyWmAA5-o-5gqZ/edit?usp=drive_link&ouid=113818867946133100869&rtpof=true&sd=true';
const bottomURL = 'https://sites.google.com/hanlin.com.tw/spine/%E9%A6%96%E9%A0%81';

/* 固定尺寸：1600×1200 → 下半部左右各 800×600 */
const LEFT_W = 960;     // 左邊視窗寬度
const RIGHT_W = 800;    // 右邊視窗寬度
const WIN_H = 600;      // 兩個視窗高度

const LEFT_X = 0;       // 左邊視窗從最左側開始
const RIGHT_X = 960;    // 右邊視窗接在左邊視窗後面
const BOTTOM_Y = 600;   // 兩個視窗都放在下方

function openTwoSheets () {
  /* 先開視窗，feature 字串只放 size，用 moveTo 來排位置 */
const leftFeat = `width=${LEFT_W},height=${WIN_H}`;
const rightFeat = `width=${RIGHT_W},height=${WIN_H}`;

const w1 = window.open(topURL, '_blank', leftFeat);
const w2 = window.open(bottomURL, '_blank', rightFeat);

  /* 移到指定座標 */
if (w1) w1.moveTo(LEFT_X, BOTTOM_Y);
if (w2) w2.moveTo(RIGHT_X, BOTTOM_Y);
// 若想讓這個中介頁自動關閉（可選）
      setTimeout(()=>window.close(), 200);
}

/* onload 直接執行；若被瀏覽器擋彈窗，就改成按鈕 click */
window.onload = openTwoSheets;
</script>
</head>
<body>
<h2>正在開啟兩個視窗，請稍候…</h2>
</body>
</html>
